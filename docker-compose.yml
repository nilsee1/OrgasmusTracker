services:
  orgasmus-tracker:
    image: ghcr.io/nilsee1/orgasmustracker:latest
    container_name: orgasmus-tracker-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - RUST_LOG=info
      - TZ=${TZ:-Europe/Berlin}
      - DB_PATH=/app/data/tracker.db
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

