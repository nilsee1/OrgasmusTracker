[package]
name = "orgasmus-tracker"
version = "0.1.0"
edition = "2021"
authors = ["nils"]
description = "Telegram bot for tracking personal logs with SQLite and Rust"

[dependencies]
teloxide = { version = "0.17", default-features = false, features = ["macros", "rustls", "ctrlc_handler"] }
tokio = { version = "1.43", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "migrate", "derive"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
dotenvy = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
regex = "1.11"
html-escape = "0.2"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.17"

